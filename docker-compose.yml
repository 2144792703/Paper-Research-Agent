services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 容器内 127.0.0.1 指向容器自身；默认 remote，走本地需把 OLLAMA_HOST 指向可达地址
      - MODEL_PROVIDER=${MODEL_PROVIDER:-remote}
    volumes:
      # 缓存落宿主机，容器删除后仍可复用
      # <宿主机路径或卷名>:<容器内路径>[:权限]
      - ./.cache:/app/.cache
